<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Content Creator — Phases 1–3 + Re‑Enter</title>
  <style>
    :root {
      --bg:#0b0f14; --panel:#141a21; --muted:#98a2b3; --text:#e6edf3;
      --accent:#00ffff; --accent-2:#0ea5e9; --danger:#ff6161; --ok:#36d399;
      --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
      --card-border:1px solid rgba(255,255,255,.08);
    }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body {
      margin:0; font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,"Noto Sans";
      color:var(--text);
      background: radial-gradient(1200px 600px at 50% -10%, rgba(0,255,255,.08), transparent 60%), var(--bg);
    }
    .wrap { max-width:980px; margin:48px auto; padding:0 20px; }
    header { text-align:center; margin-bottom:28px; }
    header .logo {
      width:52px;height:52px;display:grid;place-items:center;margin:0 auto 14px;border-radius:12px;
      background:linear-gradient(135deg, rgba(0,255,255,.25), rgba(14,165,233,.25));
      border:var(--card-border); box-shadow:var(--shadow);
    }
    header h1 { margin:0 0 6px; font-size:28px; letter-spacing:.2px; }
    header p { margin:0; color:var(--muted); }

    .card {
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:var(--card-border); border-radius:var(--radius);
      padding:22px; box-shadow:var(--shadow);
    }

    /* ---------- Form ---------- */
    .panel { display:grid; gap:16px; }
    label { font-size:14px; color:#c9d4df; display:block; margin-bottom:6px; }
    input[type="text"], textarea {
      width:100%; color:var(--text); background:#0f141a; border:var(--card-border);
      outline:none; border-radius:12px; padding:12px 14px; font-size:15px;
      transition:border-color .2s, box-shadow .2s;
    }
    textarea { resize:vertical; min-height:120px; }
    input[type="text"]:focus, textarea:focus {
      border-color:rgba(14,165,233,.55); box-shadow:0 0 0 3px rgba(14,165,233,.18);
    }

    .actions { margin-top:2px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button {
      appearance:none; border:none; cursor:pointer; padding:12px 16px; border-radius:12px;
      background:#0f141a; color:var(--text); font-weight:600; letter-spacing:.2px;
      border:1px solid rgba(255,255,255,.1);
      transition:transform .02s, border-color .2s, background .2s;
    }
    button.primary { background:linear-gradient(90deg, rgba(0,255,255,.15), rgba(14,165,233,.15)); border-color:rgba(0,255,255,.35); }
    button.secondary { background:#0f141a; }
    button:active { transform:translateY(1px); }
    button[disabled]{ opacity:.6; cursor:not-allowed; }

    .status { margin-top:6px; font-size:14px; padding:12px 14px; border-radius:12px;
      background:#0f141a; border:var(--card-border); color:var(--muted); white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .status.ok { border-color:rgba(54,211,153,.4); color:#c6ffe4; }
    .status.err{ border-color:rgba(255,97,97,.45); color:#ffd6d6; }
    .muted { color:var(--muted); font-size:13px; }

    /* ---------- Inline status badges ---------- */
    .badge { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:#0f141a; border:var(--card-border); font-size:13px; color:var(--muted); }
    .badge .dot { width:8px;height:8px;border-radius:999px;background:#6b7280; }
    .badge.good .dot{ background:#22c55e; }
    .badge.wait .dot{ background:#fbbf24; }
    .badge.err  .dot{ background:#ef4444; }

    /* ---------- Results section (below form) ---------- */
    .results { margin-top:16px; display:grid; gap:14px; }
    .results-header { display:flex; justify-content:space-between; align-items:center; }
    .result-grid { display:grid; gap:14px; grid-template-columns:1fr; }
    @media (min-width: 800px) { .result-grid { grid-template-columns: 1fr 1fr; } }

    .result-card {
      background:#0f141a; border:var(--card-border); border-radius:14px; padding:14px;
      display:flex; flex-direction:column; min-height:140px;
    }
    .result-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .result-head h3 { margin:0; font-size:15px; }
    .result-content {
      white-space:pre-wrap; font-size:14px; line-height:1.5; color:#e9eff5;
      overflow:auto;
      overflow-wrap:anywhere; word-break:break-word;
      max-height: 38vh;   /* scroll inside card */
      padding-right: 6px;
    }

    .json-toggle { margin-top:8px; font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; }
    footer { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">⚙️</div>
      <h1>AI Content Creator</h1>
      <p class="muted">Transform your ideas into compelling content</p>
    </header>

    <!-- Form + inline status -->
    <main class="card panel" role="form" aria-labelledby="title-input">
      <div>
        <label for="title-input">Title <span class="muted">(required)</span></label>
        <input id="title-input" type="text" placeholder="Enter your content title..." maxlength="200" required />
      </div>

      <div>
        <label for="desc-input">Description <span class="muted">(required)</span></label>
        <textarea id="desc-input" placeholder="Describe what you want to create in detail..." maxlength="4000" required></textarea>
      </div>

      <div>
        <label for="inst-input">Instruction <span class="muted">(optional)</span></label>
        <textarea id="inst-input" placeholder="Tone, hashtags, length, call-to-action, etc. (optional)" maxlength="4000"></textarea>
      </div>

      <div class="actions">
        <button id="submit-btn" class="primary">⚡ Generate</button>
        <button id="reenter-btn" class="secondary" hidden>↩ Re‑Enter</button>
        <span id="state-label" class="muted">Idle</span>

        <span class="badge wait" id="badge-phase"><span class="dot"></span><span id="badge-phase-text">Waiting</span></span>
        <span class="badge" id="badge-elapsed"><span class="dot"></span><span id="elapsed-text">Elapsed: 00:00</span></span>
        <span class="badge" id="badge-remaining"><span class="dot"></span><span id="remaining-text">Remaining: 06:00</span></span>
      </div>

      <div id="status" class="status" aria-live="polite" hidden></div>
    </main>

    <!-- Results below the form -->
    <section class="results card" id="results-section" aria-live="polite">
      <div class="results-header">
        <h2 style="margin:0;font-size:16px;">Results</h2>
        <div class="json-toggle" id="toggle-raw" hidden>Show raw JSON</div>
      </div>

      <div class="result-grid">
        <article class="result-card">
          <div class="result-head">
            <h3>Version 1</h3>
            <button class="secondary" id="copy-v1" disabled>Copy</button>
          </div>
          <div class="result-content" id="v1">—</div>
        </article>

        <article class="result-card">
          <div class="result-head">
            <h3>Version 2</h3>
            <button class="secondary" id="copy-v2" disabled>Copy</button>
          </div>
          <div class="result-content" id="v2">—</div>
        </article>
      </div>

      <div id="raw-json" class="status" hidden></div>
    </section>

    <footer>Powered by advanced AI • Create unlimited content</footer>
  </div>

  <!-- Short success beep -->
  <audio id="beep">
    <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQAAAC4AAAACAAACcQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/4xAARAAAQAwDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAAAAQGB//EABQBAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhADEAAAAc2CqKQAAAAAAP//Z" type="audio/mp3" />
  </audio>

  <script>
    /* ---------- Replace with your endpoints ---------- */
    const W1_WEBHOOK_URL = 'https://n8n.aw-dev.site/webhook/linkedinpost';
    const W2_WEBHOOK_URL = 'https://n8n.aw-dev.site/webhook/linkedinpost_result';

    /* ---------- Timing ---------- */
    const REQUEST_TIMEOUT_MS = 15000;
    const INITIAL_WAIT_MS = 2 * 60 * 1000;
    const POLL_INTERVAL_MS = 30 * 1000;
    const TOTAL_TIMEOUT_MS  = 6 * 60 * 1000;

    /* ---------- DOM ---------- */
    const $title = document.getElementById('title-input');
    const $desc  = document.getElementById('desc-input');
    const $inst  = document.getElementById('inst-input');
    const $btn   = document.getElementById('submit-btn');
    const $reenter = document.getElementById('reenter-btn');
    const $state = document.getElementById('state-label');
    const $status = document.getElementById('status');

    const $badgePhase = document.getElementById('badge-phase');
    const $badgePhaseText = document.getElementById('badge-phase-text');
    const $elapsedText = document.getElementById('elapsed-text');
    const $remainingText = document.getElementById('remaining-text');

    const $v1 = document.getElementById('v1');
    const $v2 = document.getElementById('v2');
    const $copyV1 = document.getElementById('copy-v1');
    const $copyV2 = document.getElementById('copy-v2');

    const $toggleRaw = document.getElementById('toggle-raw');
    const $raw = document.getElementById('raw-json');
    const $beep = document.getElementById('beep');

    /* ---------- Utils ---------- */
    function genRequestId(){
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      const rand = Array.from({length:16},()=>Math.floor(Math.random()*256));
      return 'req-'+Date.now().toString(36)+'-'+rand.map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    function setState(t){ $state.textContent = t; }
    function showStatus(msg,type='info'){
      $status.hidden=false;
      $status.className='status'+(type==='ok'?' ok':type==='err'?' err':'');
      $status.textContent=msg;
    }
    function clearStatus(){ $status.hidden=true; $status.className='status'; $status.textContent=''; }
    async function postJSON(url,payload,timeoutMs=REQUEST_TIMEOUT_MS){
      const controller=new AbortController();
      const t=setTimeout(()=>controller.abort(),timeoutMs);
      try{
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
        const text=await res.text(); let data=null; try{data=text?JSON.parse(text):null;}catch{}
        return {ok:res.ok,status:res.status,data,raw:text};
      } finally { clearTimeout(t); }
    }
    function formatMMSS(ms){ const s=Math.max(0,Math.floor(ms/1000)); const mm=String(Math.floor(s/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); return `${mm}:${ss}`; }

    /* ---------- Timers / FSM ---------- */
    let timerTick=null, pollTimer=null, initialWaitTimer=null;
    let startedAt=null, requestID=null, finished=false;

    function startUITimer(){
      stopUITimer();
      timerTick=setInterval(()=>{
        const elapsed=Date.now()-startedAt;
        const remaining=Math.max(0,TOTAL_TIMEOUT_MS-elapsed);
        $elapsedText.textContent='Elapsed: '+formatMMSS(elapsed);
        $remainingText.textContent='Remaining: '+formatMMSS(remaining);
      },1000);
    }
    function stopUITimer(){ if(timerTick){ clearInterval(timerTick); timerTick=null; } }
    function stopAllTimers(){
      if(initialWaitTimer){ clearTimeout(initialWaitTimer); initialWaitTimer=null; }
      if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
      stopUITimer();
    }

    function resetResults(){
      $v1.textContent='—'; $v2.textContent='—';
      $copyV1.disabled=true; $copyV2.disabled=true;
      $toggleRaw.hidden=true; $raw.hidden=true; $raw.textContent='';
    }
    function resetUI(){
      setState('Idle');
      $badgePhase.className='badge wait';
      $badgePhaseText.textContent='Waiting';
      $elapsedText.textContent='Elapsed: 00:00';
      $remainingText.textContent='Remaining: 06:00';
      resetResults(); clearStatus();
      $reenter.hidden = true;  // hide until run ends
    }

    function finishRun(success=false){
      stopAllTimers();
      $btn.disabled=false;
      $reenter.hidden=false;   // show Re‑Enter button
    }

    /* ---------- Copy ---------- */
    async function copyText(t){
      try{ await navigator.clipboard.writeText(t); showStatus('Copied to clipboard.','ok'); }
      catch{
        const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showStatus('Copied to clipboard.','ok');
      }
    }
    $copyV1.addEventListener('click',()=>copyText($v1.textContent));
    $copyV2.addEventListener('click',()=>copyText($v2.textContent));

    /* ---------- Validation ---------- */
    function validate(){
      const title=$title.value.trim(), desc=$desc.value.trim(), errs=[];
      if(!title) errs.push('Title is required.');
      if(!desc)  errs.push('Description is required.');
      if(title.length>200) errs.push('Title exceeds 200 characters.');
      if(desc.length>4000) errs.push('Description exceeds 4000 characters.');
      if($inst.value.trim().length>4000) errs.push('Instruction exceeds 4000 characters.');
      return errs;
    }

    /* ---------- Polling ---------- */
    async function pollOnce(){
      const elapsed=Date.now()-startedAt;
      if(elapsed >= TOTAL_TIMEOUT_MS){
        $badgePhase.className='badge err'; $badgePhaseText.textContent='Timeout';
        setState('Timeout'); showStatus('We couldn’t retrieve results within 6 minutes. Please try again.','err');
        finishRun(false);
        return;
      }
      const resp=await postJSON(W2_WEBHOOK_URL,{requestID});
      if(resp.status===400){ setState('Polling (still processing)…'); return; }
      if(resp.ok && resp.status===200 && resp.data){
        $badgePhase.className='badge good'; $badgePhaseText.textContent='Completed'; setState('Success');

        try{ $beep.currentTime=0; $beep.play(); }catch{}
        alert('Your LinkedIn posts are ready!');

        // Accept both flat and nested formats
        const payload = resp.data;
        const v1 = payload?.data?.version1 ?? payload?.version1 ?? '';
        const v2 = payload?.data?.version2 ?? payload?.version2 ?? '';

        $v1.textContent = typeof v1 === 'string' ? v1 : JSON.stringify(v1,null,2);
        $v2.textContent = typeof v2 === 'string' ? v2 : JSON.stringify(v2,null,2);
        $copyV1.disabled = !$v1.textContent.trim();
        $copyV2.disabled = !$v2.textContent.trim();

        $toggleRaw.hidden=false; $raw.textContent=JSON.stringify(resp.data,null,2);
        showStatus('Results received.','ok');
        finishRun(true);
        return;
      }
      setState('Polling (temporary issue)…');
    }

    function beginPollingSequence(){
      $badgePhase.className='badge wait'; $badgePhaseText.textContent='Accepted — waiting 2:00';
      setState('Waiting before first check…');
      initialWaitTimer=setTimeout(()=>{
        $badgePhaseText.textContent='Polling every 30s';
        setState('Polling…');
        pollTimer=setInterval(pollOnce, POLL_INTERVAL_MS);
        pollOnce(); // first poll immediately at T+2:00
      }, INITIAL_WAIT_MS);
    }

    /* ---------- Submit ---------- */
    async function onSubmit(e){
      e.preventDefault(); clearStatus(); resetResults();

      const errs=validate();
      if(errs.length){ showStatus('Please fix the following:\n• '+errs.join('\n• '),'err'); return; }

      requestID=genRequestId();
      const payload={ requestID, title:$title.value.trim(), description:$desc.value.trim(), instruction:$inst.value.trim() || null, submittedAt:new Date().toISOString() };
      sessionStorage.setItem('lastSubmission', JSON.stringify(payload));

      $btn.disabled=true; startedAt=Date.now(); finished=false; startUITimer();

      setState('Submitting…');
      const resp=await postJSON(W1_WEBHOOK_URL,payload);
      if(!resp.ok){
        setState('Idle');
        showStatus(`Workflow 1 returned ${resp.status}.\n${resp.raw || '(empty response)'}`,'err');
        finishRun(false);
        return;
      }
      const r=resp.data||{};
      if(r.requestID!==requestID || r.status!=='accepted'){
        setState('Idle');
        showStatus(`Invalid confirmation from Workflow 1.\nExpected requestID: ${requestID}, got: ${r.requestID || '(missing)'}; status="${r.status}"\nRaw: ${resp.raw || '(empty)'}`,'err');
        finishRun(false);
        return;
      }

      showStatus(`✅ Request accepted.\nRequestID: ${requestID}\n\nPolling will start automatically in 2 minutes.`,'ok');
      $badgePhase.className='badge wait'; $badgePhaseText.textContent='Accepted — waiting 2:00'; setState('Accepted (waiting)');
      beginPollingSequence();
    }

    /* ---------- Re‑Enter ---------- */
    $reenter.addEventListener('click', () => {
      // stop any timers and re-enable generate button
      stopAllTimers();
      $btn.disabled = false;
      // reset UI state and hide Re-Enter
      resetUI();
      // clear form fields when re-entering
      $title.value = '';
      $desc.value  = '';
      $inst.value  = '';
      // focus the title for convenience
      document.getElementById('title-input').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ---------- Raw JSON toggle ---------- */
    let rawShown=false;
    document.getElementById('toggle-raw').addEventListener('click',()=>{
      rawShown=!rawShown;
      $toggleRaw.textContent = rawShown ? 'Hide raw JSON' : 'Show raw JSON';
      $raw.hidden = !rawShown;
    });

    document.getElementById('submit-btn').addEventListener('click', onSubmit);

    // Initial state
    (function init(){
      setState('Idle');
      $elapsedText.textContent='Elapsed: 00:00';
      $remainingText.textContent='Remaining: 06:00';
    })();
  </script>
</body>
</html>
